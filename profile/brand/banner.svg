<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 924 462" width="924" height="462" role="img" aria-label="AI SAFE EARTH — research, communicate, build">
  <rect width="924" height="462" fill="#131A21"/>

  <!-- corner ticks: from the map, not the pitch deck -->
  <g stroke="#4A5560" stroke-width="1.5">
    <path d="M 40 28 h 26 M 40 28 v 26"/>
    <path d="M 884 28 h -26 M 884 28 v 26"/>
    <path d="M 40 434 h 26 M 40 434 v -26"/>
    <path d="M 884 434 h -26 M 884 434 v -26"/>
  </g>

  <!-- the emblem: earth, the open fourth ring, one place -->
  <g transform="translate(96, 128) scale(0.205)">
    <circle cx="512" cy="512" r="240" fill="#1F5D7A"/>
    <path d="M 840.9 564.1 A 333 333 0 1 1 840.9 459.9" fill="none" stroke="#F2EFE8" stroke-width="35"/>
    <circle cx="845" cy="512" r="53" fill="#C4692A"/>
  </g>

  <text x="336" y="168" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="600" letter-spacing="10" fill="#F2EFE8">AI SAFE EARTH</text>
  <text x="338" y="200" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="6" fill="#9AA3A8">RESEARCH · COMMUNICATE · BUILD</text>

  <line x1="96" y1="290" x2="828" y2="290" stroke="#4A5560" stroke-width="1"/>

  <text x="96" y="330" font-family="Spectral, Georgia, serif" font-size="19" fill="#C3BEB2">Three rings of defence exist: the model, the product, the state.</text>
  <text x="96" y="358" font-family="Spectral, Georgia, serif" font-size="19" fill="#F2EFE8">We are building the fourth, around communities.</text>

  <!-- scale bar: at what scale are we looking, and therefore what exists -->
  <g transform="translate(96, 398)">
    <line x1="0" y1="0" x2="132" y2="0" stroke="#4A5560" stroke-width="1.5"/>
    <path d="M 0 -4 v 8 M 33 -3 v 6 M 66 -3 v 6 M 99 -3 v 6 M 132 -4 v 8" stroke="#4A5560" stroke-width="1.5"/>
    <text x="0" y="20" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#4A5560">COMMUNITY SCALE</text>
  </g>

  <text x="828" y="404" text-anchor="end" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#9AA3A8">OPEN UMBRELLA · AI SAFETY &amp; CIVIC TECH</text>
</svg>
